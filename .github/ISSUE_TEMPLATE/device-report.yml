name: Device report
description: Report how lightmount behaves with your Light Mount keyboard (works, partly works, or not at all).
title: "[device] "
labels: [device-report]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! lightmount is unofficial and has been tested on a single keyboard version so far:
        reports from other versions are the most useful ones.
  - type: textarea
    id: status
    attributes:
      label: Output of `lightmount status`
      description: Shows the device, its version and the lighting mode. It contains no serial number.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Output of `lightmount --version`
      placeholder: lightmount 0.1.1
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distribution and kernel
      placeholder: Arch Linux, 6.x
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installed with
      options:
        - install/install.sh
        - Arch package (release or PKGBUILD)
        - .deb
        - other
    validations:
      required: true
  - type: checkboxes
    id: works
    attributes:
      label: What works
      options:
        - label: "`lightmount apply`: the zones get their colors"
        - label: Colors come back after replugging the keyboard
        - label: Colors come back after Fn+←/→
        - label: Notification alerts
        - label: Shell error alerts
  - type: textarea
    id: details
    attributes:
      label: What happened
      description: What you did, what you expected, what you saw. Add `journalctl --user -u lightmount` lines if relevant.
    validations:
      required: true
