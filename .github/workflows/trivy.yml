# Trivy scan of the repository: vulnerabilities, leaked secrets, misconfigurations.
# The full report goes to the Security tab; HIGH and CRITICAL findings fail the job.
name: Trivy

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'  # weekly, for newly published CVEs
  workflow_call:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # SARIF upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Report (all severities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: v0.76.0
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy.sarif
          exit-code: '0'
      - name: Upload to the Security tab
        if: always() && github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v4.39.0
        with:
          sarif_file: trivy.sarif
          category: trivy
      - name: Gate (HIGH, CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: v0.76.0
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'
