# Release on a version tag (v0.1.0, ...): tests, Trivy, packages, GitHub release.
#   git tag -a v0.1.0 -m "lightmount 0.1.0" && git push origin v0.1.0
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    name: tag matches the code version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Compare
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n "s/^__version__ = '\(.*\)'/\1/p" lightmount/__init__.py)
          pkgver=$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)
          echo "tag $TAG, code $version, PKGBUILD $pkgver"
          test "$TAG" = "v$version" && test "$pkgver" = "$version"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  trivy:
    needs: version
    uses: ./.github/workflows/trivy.yml
    permissions:
      contents: read
      security-events: write

  release:
    needs: [ci, trivy]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Source tarball, PKGBUILD with checksum, SHA256SUMS
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          version=${TAG#v}
          # "-source": must not share the PKGBUILD source name, or makepkg would pick it up from the same folder
          git archive --prefix="keyboard_bequiet_lightmount_rgb-$version/" -o "dist/lightmount-$version-source.tar.gz" HEAD
          # The PKGBUILD downloads GitHub's own archive of the tag: checksum that one
          curl -fsSL --retry 3 -o tag.tar.gz "https://github.com/$REPO/archive/refs/tags/$TAG.tar.gz"
          sum=$(sha256sum tag.tar.gz | cut -d' ' -f1)
          sed "s/^sha256sums=.*/sha256sums=('$sum')/" packaging/arch/PKGBUILD > dist/PKGBUILD
          cp packaging/arch/lightmount.install dist/
          grep -q "^sha256sums=('$sum')" dist/PKGBUILD
          (cd dist && sha256sum -- * > SHA256SUMS)
          ls -l dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --title "lightmount ${TAG#v}" --generate-notes
